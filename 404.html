<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata — Le Popolari</title>
  <meta name="robots" content="noindex, follow" />
  <style>
    :root {
      --terra: #4A3728;
      --panna: #F5EFE6;
      --legno: #C9A87C;
      --terra-light: #6B4E3D;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--terra);
      color: var(--panna);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 200;
      color: var(--legno);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .error-text {
      color: rgba(245,239,230,0.7);
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--legno);
      color: var(--terra);
      padding: 1rem 2rem;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,168,124,0.3);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1 class="error-title">Pagina non trovata</h1>
  <p class="error-text">La strada che stai cercando non porta da nessuna parte. Torna alla home e ricomincia il tuo viaggio in Puglia.</p>
  <a href="/" class="btn">← Torna alla home</a>
</body>
</html>
